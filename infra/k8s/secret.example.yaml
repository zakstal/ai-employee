# Copy to secret.yaml and fill in real values before applying — do not commit
# the filled-in version. DATABASE_URL / DBOS_SYSTEM_DATABASE_URL below assume
# a Cloud SQL Auth Proxy sidecar listening on 127.0.0.1:5432 (see infra/gcp/README.md
# for why Cloud SQL uses public IP + proxy instead of private IP).
apiVersion: v1
kind: Secret
metadata:
  name: control-plane-secrets
  namespace: ai-employee
type: Opaque
stringData:
  DATABASE_URL: "postgres://ai:CHANGE_ME@127.0.0.1:5432/ai_employee"
  DBOS_SYSTEM_DATABASE_URL: "postgres://ai:CHANGE_ME@127.0.0.1:5432/ai_employee_dbos"
  SLACK_SIGNING_SECRET: "changeme"
  SLACK_BOT_TOKEN: "xoxb-changeme"
  ANTHROPIC_API_KEY: "changeme"
