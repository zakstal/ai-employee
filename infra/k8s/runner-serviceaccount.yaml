# TODO: packages/adapters/src/k8s-job.ts (KubernetesJobRuntime) sets
# `automountServiceAccountToken: false` on Job pods and only sets
# `spec.serviceAccountName` when KubernetesJobRuntimeOptions.serviceAccountName
# is passed in. For runner pods to authenticate to Vertex AI via Workload
# Identity using this ServiceAccount, the control plane must construct
# `new KubernetesJobRuntime({ serviceAccountName: "runner" })` — otherwise
# Job pods run as the namespace's default SA and this binding has no effect.
#
# PROJECT_ID below is a literal placeholder — replace before applying.
# This manifest targets the `dev` employee namespace (ai-emp-dev); create one
# copy per employee_id in infra/gcp's `employee_ids` variable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  namespace: ai-emp-dev
  annotations:
    iam.gke.io/gcp-service-account: ai-employee-runner@PROJECT_ID.iam.gserviceaccount.com
