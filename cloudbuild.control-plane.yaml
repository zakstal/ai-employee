substitutions:
  _REPO: us-central1-docker.pkg.dev/my-gcp-project/ai-employee
  _TAG: dev
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/control-plane/Dockerfile", "-t", "${_REPO}/control-plane:${_TAG}", "-t", "${_REPO}/control-plane:latest", "."]
images: ["${_REPO}/control-plane:${_TAG}", "${_REPO}/control-plane:latest"]
