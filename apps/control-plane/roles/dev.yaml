      - url: https://github.com/your-org/app.git
      - url: https://github.com/your-org/legacy-app.git
    maxTurns: 150
    runtime: cloudrun
    cpu: 2
    memoryMb: 4096
    timeoutSec: 1800
    credentials: [claude-subscription, github]
  - id: manager
    description: Owns the migration backlog. Woken when backlog work finishes; dispatches what is unblocked. Writes no code.
    systemPromptFile: prompts/manager.md
    allowedTools:
      - Read
      - Grep
      - Glob
      - WebFetch
      - "Bash(gh *)"
      - "Bash(git *)"
      - "Bash(jq *)"
      - "mcp__clickup__*"
    mcpServers:
      clickup:
        command: clickup-mcp
        env:
          CLICKUP_API_KEY: "${CLICKUP_API_TOKEN}"
          CLICKUP_TEAM_ID: "${CLICKUP_TEAM_ID}"
          CLICKUP_MCP_MODE: write   # it keeps the backlog page current
    maxTurns: 60
    runtime: k8s
    cpu: 1
    memoryMb: 2048
    timeoutSec: 1800
    credentials: [claude-subscription, clickup, github]
    capabilities: [agents, backlog]
    canSpawn: [developer, compound, triage, spec, implement, review, schema-lead]
  - id: monitor-triage
    description: Sonnet triage for monitor findings. Says NOISE (posts nothing) or a short alert in dev-bot. Read-only.
    systemPromptFile: prompts/monitor-triage.md
    model: sonnet
    allowedTools:
      - Read
      - Grep
      - WebFetch
      - "Bash(az *)"
      - "Bash(gh search prs *)"
      - "Bash(gh pr list *)"
      - "Bash(gh pr view *)"
      - "mcp__clickup__*"
    mcpServers:
      clickup:
        command: clickup-mcp
        env:
          CLICKUP_API_KEY: "${CLICKUP_API_TOKEN}"
          CLICKUP_TEAM_ID: "${CLICKUP_TEAM_ID}"
          CLICKUP_MCP_MODE: read
    maxTurns: 20
    runtime: k8s
    cpu: 1
    memoryMb: 2048
    timeoutSec: 900
    credentials: [claude-subscription, clickup, azure-user, github]
    # Escalation: may hand a real finding to the developer (sdlc) or compound workstream. Fire-and-forget; the
    # workstream's final report is relayed to dev-bot when it finishes (postResult orphan-child relay).
    capabilities: [agents]
    canSpawn: [developer, compound]
  - id: ops
    description: Read-only operations. May run az and gh read commands and query ClickUp.
    image: ai-employee-runner-ops:dev
    systemPrompt: |
      You are Dev Bot in ops mode. You may inspect cloud state with the CLIs available but must not
      mutate anything. If a tool is unauthenticated, say so plainly and stop.
    allowedTools:
      - Read
      - Grep
      - Glob
      - "Bash(az *)"
      - "Bash(gh *)"
      - "mcp__clickup__*"
    mcpServers:
      clickup:
        command: clickup-mcp
        env:
          CLICKUP_API_KEY: "${CLICKUP_API_TOKEN}"
          CLICKUP_TEAM_ID: "${CLICKUP_TEAM_ID}"
          CLICKUP_MCP_MODE: read
    maxTurns: 15
    runtime: k8s
    cpu: 1
    memoryMb: 2048
    timeoutSec: 600
    credentials: [claude-subscription, clickup, azure, azure-user, github]
