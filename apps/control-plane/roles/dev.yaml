id: dev
name: Dev Bot
defaultRole: developer
workstreams:
  sdlc:
    entryRole: developer
    description: "triage → spec → implement → review"
  compound:
    entryRole: compound
    description: "compound-engineering lfg: plan → work → simplify → review → PR; learnings captured in docs/solutions"
# Background monitors. Deterministic collectors, NO model while quiet; a triage task only on something new.
# All OFF by default — dev-bot turns them on/off via enable_monitor / disable_monitor when asked.
monitors:
  azure-errors:
    collector: azure-errors
    everyMin: 5
    role: monitor-triage
    description: "Azure sweep: new/spiking App Insights exceptions and 5xx per app, plus new Azure Monitor alerts"
    config:
      lookbackMin: 15
      minCount: 5        # SPIKE: at least this many in the window ...
      spikeFactor: 3     # ... and >= 3x the signature's 24h peak (not just the previous run)
      minNew: 3          # NEW signatures below this are ignored
      alerts: true
      alertCooldownMin: 360  # same alert rule + target at most every 6h
      apps:
        # rg = Azure resource group, name = Application Insights component in it
        - { rg: my-app-prod, name: my-app-prod-insights }
        - { rg: my-app-staging, name: my-app-staging-insights }
  clickup-channels:
    collector: clickup-channels
    everyMin: 5
    role: monitor-triage
    description: "New messages in the dev and support ClickUp channels"
    config:
      channels:
        # id = ClickUp channel id (Chat view URL), name = label used in triage output
        - { id: abc12-34567, name: support }
        - { id: abc12-34568, name: support-alerts }
        - { id: abc12-34569, name: dev }
roles:
  - id: assistant
    description: General engineering assistant. Read-only against the repo it is given.
    systemPrompt: |
      You are Dev Bot, an AI engineer on this team. Be concise. Your final message is
      posted verbatim as the reply in the channel the request came from (a ClickUp task
      comment or a Slack thread), so write it as that reply: plain prose, no headings, no
      meta commentary about where it will be posted.
    allowedTools: [Read, Grep, Glob, WebSearch, WebFetch, "mcp__clickup__*"]
    mcpServers:
      clickup:
        command: clickup-mcp          # @hauptsache.net/clickup-mcp, preinstalled in the runner image
        env:
          CLICKUP_API_KEY: "${CLICKUP_API_TOKEN}"
          CLICKUP_TEAM_ID: "${CLICKUP_TEAM_ID}"
          CLICKUP_MCP_MODE: read      # read-minimal | read | write
    maxTurns: 25
    runtime: k8s
    cpu: 1
    memoryMb: 2048
    timeoutSec: 900
    # grants: anthropic (ANTHROPIC_API_KEY) | claude-subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`) | vertex
    credentials: [anthropic, claude-subscription, clickup]
  - id: developer
