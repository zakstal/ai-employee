# The sdlc bundle: the stage roles of a software-delivery employee (foreman -> triage -> spec -> implement -> review),
# plus compound, manager, monitor-triage, assistant and ops. An employee file pulls it in with `use: [sdlc]`
# and patches what is its own: repos, vars, monitors, extra roles. A role defined in the employee file with the same id
# as one here patches it (`+key` appends to a list, `-key` removes entries).
#
# Prompts are in presets/prompts. Vars they read ({{NAME}} or {{NAME:-default}}), all optional except PR_SIGNATURE and
# BOT_NAME, which have built-in defaults: PR_SIGNATURE, EMPLOYER, GITHUB_ORG, TRIAGE_REPOS, DEFAULT_REPO, TICKET_EXAMPLE.
# Images: roles name a key of RUNNER_IMAGES (`imageRef`): runner (default), runner-ops (az + a larger toolbelt).
# Logins: roles name the built-in grants (claude-subscription, clickup, github, azure-user, azure, anthropic); see docs/credentials.md.
workstreams:
  sdlc:
    entryRole: developer
    description: "triage → spec → implement → review"
  compound:
    entryRole: compound
    description: "compound-engineering lfg: plan → work → simplify → review → PR; learnings captured in docs/solutions"
x-clickup-read: &clickup_read
  clickup:
    command: clickup-mcp          # @hauptsache.net/clickup-mcp, preinstalled in the runner image
    env:
      CLICKUP_API_KEY: "${CLICKUP_API_TOKEN}"
      CLICKUP_TEAM_ID: "${CLICKUP_TEAM_ID}"
      CLICKUP_MCP_MODE: read      # read-minimal | read | write
roles:
  # Abstract (the leading underscore): the shared body of the four stage roles. Not an employee role itself.
  - id: _worker
    allowedTools:
      - "Read"
      - "Grep"
      - "Glob"
      - "Edit"
      - "Write"
      - "WebSearch"
      - "WebFetch"
      - "Bash(git *)"
      - "Bash(gh *)"
      - "Bash(pnpm *)"
      - "Bash(npm *)"
      - "Bash(npx *)"
      - "Bash(yarn *)"
      - "Bash(node *)"
      - "Bash(python3 *)"
      - "Bash(bash *)"
      - "Bash(sh *)"
      - "Bash(pg-scratch)"
      - "Bash(psql *)"
      - "Bash(pg_ctl *)"
      - "Bash(initdb *)"
      - "Bash(createdb *)"
      - "Bash(ls *)"
      - "Bash(cat *)"
      - "Bash(head *)"
      - "Bash(tail *)"
      - "Bash(wc *)"
      - "Bash(grep *)"
      - "Bash(rg *)"
      - "Bash(find *)"
      - "Bash(sed *)"
      - "Bash(awk *)"
      - "Bash(diff *)"
      - "Bash(jq *)"
      - "Bash(sort *)"
      - "Bash(uniq *)"
      - "Bash(cut *)"
      - "Bash(tr *)"
      - "Bash(xargs *)"
      - "Bash(mkdir *)"
      - "Bash(cp *)"
      - "Bash(mv *)"
      - "Bash(rm *)"
      - "Bash(touch *)"
      - "Bash(chmod *)"
      - "Bash(env *)"
      - "Bash(export *)"
      - "Bash(which *)"
      - "Bash(echo *)"
      - "Bash(test *)"
      - "Bash(cd *)"
      - "Bash(pwd)"
      - "mcp__clickup__*"
    mcpServers: *clickup_read
    runtime: cloudrun             # isolated tier; chat stays on the warm runner
    imageRef: runner-ops          # these roles are told `az` works; the base image has no az
    # No azure-user: the token broker lives on the VM's compose network, unreachable from Cloud Run.
    # Azure evidence reaches these roles in the brief, already collected.
    credentials: [claude-subscription, clickup, github]
  - id: assistant
    description: General engineering assistant. Read-only against the repo it is given.
    systemPrompt: |
      You are {{BOT_NAME}}, an AI engineer {{EMPLOYER:-on this team}}. Be concise. Your final message is
      posted verbatim as the reply in the channel the request came from (a ClickUp task
      comment or a Slack thread), so write it as that reply: plain prose, no headings, no
      meta commentary about where it will be posted.
    allowedTools: [Read, Grep, Glob, WebSearch, WebFetch, "mcp__clickup__*"]
    mcpServers: *clickup_read
    maxTurns: 25
    runtime: k8s
    cpu: 1
    memoryMb: 2048
    timeoutSec: 900
    # grants: anthropic (ANTHROPIC_API_KEY) | claude-subscription (CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`) | vertex
    credentials: [anthropic, claude-subscription, clickup]
  - id: developer
    description: Works in checked-out repos. May read, edit, run git/gh/pnpm, open pull requests. Cannot merge (enforced by branch protection).
    systemPromptFile: prompts/foreman.md
    allowedTools:
      - "Read"
      - "Grep"
      - "Glob"
      - "Edit"
      - "Write"
      - "WebSearch"
      - "WebFetch"
      - "Bash(git *)"
      - "Bash(gh *)"
      - "Bash(az *)"
      - "Bash(pnpm *)"
      - "Bash(npm *)"
      - "Bash(npx *)"
      - "Bash(yarn *)"
      - "Bash(node *)"
      - "Bash(python3 *)"
      - "Bash(bash *)"
      - "Bash(sh *)"
      - "Bash(pg-scratch)"
      - "Bash(psql *)"
      - "Bash(pg_ctl *)"
      - "Bash(initdb *)"
      - "Bash(createdb *)"
      - "Bash(ls *)"
      - "Bash(cat *)"
      - "Bash(head *)"
      - "Bash(tail *)"
      - "Bash(wc *)"
      - "Bash(grep *)"
      - "Bash(rg *)"
      - "Bash(find *)"
      - "Bash(sed *)"
      - "Bash(awk *)"
      - "Bash(diff *)"
      - "Bash(jq *)"
      - "Bash(sort *)"
      - "Bash(uniq *)"
      - "Bash(cut *)"
      - "Bash(tr *)"
      - "Bash(xargs *)"
      - "Bash(mkdir *)"
      - "Bash(cp *)"
      - "Bash(mv *)"
      - "Bash(rm *)"
      - "Bash(touch *)"
      - "Bash(chmod *)"
      - "Bash(env *)"
      - "Bash(export *)"
      - "Bash(which *)"
      - "Bash(echo *)"
      - "Bash(test *)"
      - "Bash(cd *)"
      - "Bash(pwd)"
      - "mcp__clickup__*"
    mcpServers: *clickup_read
    # The foreman waits on its children, so it must outlive them (implement alone may run 90 min).
    maxTurns: 200
    runtime: k8s
    cpu: 2
    memoryMb: 4096
    timeoutSec: 9000
    credentials: [claude-subscription, clickup, github, azure-user]
    capabilities: [schedules, agents, monitors]
    canSchedule: [assistant, ops]
    canSpawn: [triage, spec, implement, review, ops, compound]
  - { id: triage, extends: _worker, description: "Reads a request, finds what it touches in the repos, decides whether it is clear enough to build.", systemPromptFile: prompts/triage.md, maxTurns: 100, timeoutSec: 1800 }
  - { id: spec, extends: _worker, description: "Turns a triaged request into a written spec with acceptance checks.", systemPromptFile: prompts/spec.md, maxTurns: 120, timeoutSec: 2400 }
  - id: implement
    extends: _worker
    description: Implements a spec on a branch, tests it, opens a pull request.
    systemPromptFile: prompts/implement.md
    # Turns were the binding constraint well inside the 90-minute timeout, so only maxTurns is high.
    maxTurns: 400
    timeoutSec: 5400
  - { id: review, extends: _worker, description: "Reviews a pull request against its spec and reports findings.", systemPromptFile: prompts/review.md, maxTurns: 150, timeoutSec: 1800 }
  - id: compound
    description: Runs the compound-engineering `lfg` pipeline on a brief inside a checked-out repo and ends with an open PR. Hands-off; never merges.
    systemPromptFile: prompts/compound.md
    allowedTools:
      - "Read"
      - "Grep"
      - "Glob"
      - "Edit"
      - "Write"
      - "WebSearch"
      - "WebFetch"
      - "Skill"
      - "Agent"
      - "TodoWrite"
      - "Bash(git *)"
      - "Bash(gh *)"
      - "Bash(pnpm *)"
      - "Bash(npm *)"
      - "Bash(npx *)"
      - "Bash(node *)"
      - "Bash(python3 *)"
      - "Bash(bash *)"
      - "Bash(ls *)"
      - "Bash(cat *)"
      - "Bash(mkdir *)"
      - "Bash(cp *)"
      - "Bash(mv *)"
      - "Bash(rg *)"
      - "Bash(grep *)"
      - "Bash(find *)"
      - "Bash(sed *)"
      - "Bash(head *)"
      - "Bash(tail *)"
      - "Bash(wc *)"
      - "Bash(diff *)"
      - "Bash(jq *)"
      - "Bash(test *)"
      - "Bash(echo *)"
      - "Bash(pwd)"
      - "Bash(cd *)"
      - "mcp__clickup__*"
    mcpServers: *clickup_read
    maxTurns: 300
    # Isolated tier: one Cloud Run Job execution per run, never the warm chat runner.
    runtime: cloudrun
    imageRef: runner
    cpu: 2
    memoryMb: 4096
    timeoutSec: 5400
    credentials: [claude-subscription, clickup, github]
  - id: manager
    description: Owns the backlogs. Woken when backlog work finishes; dispatches what is unblocked. Writes no code.
    systemPromptFile: prompts/manager.md
    allowedTools:
      - "Read"
      - "Grep"
      - "Glob"
      - "WebFetch"
      - "Bash(gh *)"
      - "Bash(git *)"
      - "Bash(jq *)"
      - "mcp__clickup__*"
    mcpServers:
      clickup:
        command: clickup-mcp
        env:
          CLICKUP_API_KEY: "${CLICKUP_API_TOKEN}"
          CLICKUP_TEAM_ID: "${CLICKUP_TEAM_ID}"
          CLICKUP_MCP_MODE: write   # it keeps the backlog page current
    maxTurns: 60
    runtime: k8s
    cpu: 1
    memoryMb: 2048
    timeoutSec: 1800
    credentials: [claude-subscription, clickup, github]
    capabilities: [agents, backlog]
    canSpawn: [developer, compound, triage, spec, implement, review]
  - id: monitor-triage
    description: Sonnet triage for monitor findings. Says NOISE (posts nothing) or a short alert. Read-only.
    systemPromptFile: prompts/monitor-triage.md
    model: sonnet
    allowedTools:
      - "Read"
      - "Grep"
      - "WebFetch"
      - "Bash(az *)"
      - "Bash(gh search prs *)"
      - "Bash(gh pr list *)"
      - "Bash(gh pr view *)"
      - "mcp__clickup__*"
    mcpServers: *clickup_read
    maxTurns: 20
    runtime: k8s
    cpu: 1
    memoryMb: 2048
    timeoutSec: 900
    credentials: [claude-subscription, clickup, azure-user, github]
    # Escalation: may hand a real finding to the developer (sdlc) or compound workstream. Fire-and-forget; the
    # workstream's final report is relayed when it finishes (postResult orphan-child relay).
    capabilities: [agents]
    canSpawn: [developer, compound]
  - id: ops
    description: Read-only operations. May run az and gh read commands and query ClickUp.
    imageRef: runner-ops
    systemPrompt: |
      You are {{BOT_NAME}} in ops mode. You may inspect cloud state with the CLIs available but must not
      mutate anything. If a tool is unauthenticated, say so plainly and stop.
    allowedTools:
      - "Read"
      - "Grep"
      - "Glob"
      - "Bash(az *)"
      - "Bash(gh *)"
      - "mcp__clickup__*"
    mcpServers: *clickup_read
    maxTurns: 15
    runtime: k8s
    cpu: 1
    memoryMb: 2048
    timeoutSec: 600
    credentials: [claude-subscription, clickup, azure, azure-user, github]
