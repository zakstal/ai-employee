name: images
# Publishes the engine images to GHCR on a version tag: ghcr.io/<owner>/<repo>-{control-plane,runner,runner-ops}.
# Inert in forks.
on:
  push:
    tags: ["v*"]
jobs:
  images:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Registry path (lowercase owner/repo)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: control-plane
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/control-plane/Dockerfile
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.REGISTRY }}-control-plane:${{ env.VERSION }},${{ env.REGISTRY }}-control-plane:latest
      - name: runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/runner/Dockerfile
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.REGISTRY }}-runner:${{ env.VERSION }},${{ env.REGISTRY }}-runner:latest
      - name: runner-ops
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/runner/Dockerfile.ops
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: BASE=${{ env.REGISTRY }}-runner:${{ env.VERSION }}
          tags: ${{ env.REGISTRY }}-runner-ops:${{ env.VERSION }},${{ env.REGISTRY }}-runner-ops:latest
